name: foundation-ci

on:
  push:
    branches: [main, "foundation/**"]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Solana development toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Select Anchor 1.2.0
        run: |
          avm install 1.2.0
          avm use 1.2.0
          anchor --version
          solana --version

      - name: Install dependencies
        run: yarn install

      - name: Compile
        run: anchor build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Create ephemeral CI wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"

      - name: Run 16 tests on local validator
        run: anchor test --validator legacy
